rules:
  - name: any
    watch:
      path: C:\Users\xq151\Downloads
      pattern: '*'
      exclude:
        - '*.tmp'
        - '*.crdownload'
    actions:
      - type: simple-log
      - type: script
        path: pwsh -NoProfile -Command Set-Clipboard -Value "'{{filepath}}'"

  - name: aw-category-export
    watch:
      path: C:\Users\xq151\Downloads
      pattern: 'aw-category-export*.json'
    actions:
      - type: simple-log
      - type: move
        destination: C:/mega/Backups/aw-category-export/{{filename}}
      - type: script
        path: pwsh -NoProfile -File ./git-helper.ps1 -InputFile C:/mega/Backups/aw-category-export/{{filename}}

  - name: ContextSearch-ext-backup-main
    watch:
      path: C:\Users\xq151\Downloads
      pattern: 'ContextSearchOptions_*.json'
    actions:
      - type: simple-log
      - type: move
        destination: C:/mega/Backups/contextSearch-ua01/contextsearch-backup-latest.json
      - type: script
        path: pwsh -NoProfile -File ./git-helper.ps1 -InputFile C:/mega/Backups/contextSearch-ua01/contextsearch-backup-latest.json

  - name: ContextSearch-ext-backup-private
    watch:
      path: C:\Users\xq151\Downloads\#w
      pattern: 'ContextSearchOptions_*.json'
    actions:
      - type: simple-log
      - type: move
        destination: C:/mega/Backups/contextSearch-ua02/contextsearch-backup-latest.json
      - type: script
        path: pwsh -NoProfile -File ./git-helper.ps1 -InputFile C:/mega/Backups/contextSearch-ua02/contextsearch-backup-latest.json
